name: Publish Toronto Premium Glass
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-toronto-glass.yml'
      - 'index.html'
      - 'about.html'
      - 'services.html'
      - 'gallery.html'
      - 'contact.html'
      - 'assets/**'
      - 'images/**'
      - 'video/**'
permissions:
  contents: read
concurrency:
  group: toronto-premium-glass-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: '9a4a259f9214e6f114f67cfd7995dd09'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Require private Cloudflare deployment access
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Add the CLOUDFLARE_API_TOKEN repository secret, then rerun this workflow." >&2
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identify the existing project by its custom domain
        id: project
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + account + '/pages/projects', {
            headers: {Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN}
          });
          const data = await response.json();
          if (!response.ok || !data.success || !Array.isArray(data.result)) {
            throw new Error('Cloudflare could not list Pages projects. Check account scope and Pages Edit permission.');
          }
          if ((data.result_info?.total_pages || 1) > 1) throw new Error('Project list is paginated; manual project verification is required.');
          const matching = data.result.filter(project => (project.domains || []).some(domain =>
            domain.toLowerCase().replace(/\\.$/, '') === 'torontopremiumglass.com'));
          if (matching.length !== 1) {
            throw new Error('Expected exactly one existing Pages project with torontopremiumglass.com attached. No hosting changes were made.');
          }
          const project = matching[0];
          if (!/^[a-z0-9][a-z0-9-]{0,99}$/i.test(project.name) || !project.production_branch ||
              /[\\r\\n]/.test(project.production_branch)) throw new Error('Project metadata requires manual verification.');
          appendFileSync(process.env.GITHUB_OUTPUT, 'name=' + project.name + '\\nbranch=' + project.production_branch + '\\n');
          console.log('Verified target: ' + project.name + ' / torontopremiumglass.com');
          JS
      - name: Prepare the tested static website
        run: |
          mkdir -p .deploy/assets .deploy/images .deploy/video
          cp index.html about.html services.html gallery.html contact.html .deploy/
          cp assets/apple.css assets/site.js assets/glass-motion.js .deploy/assets/
          cp -R images/. .deploy/images/
          cp -R video/. .deploy/video/
          test -s .deploy/index.html
          test -s .deploy/assets/glass-motion.js
      - name: Publish to the existing production environment
        env:
          TPG_PROJECT: ${{ steps.project.outputs.name }}
          TPG_BRANCH: ${{ steps.project.outputs.branch }}
        run: npx --yes wrangler@4 pages deploy .deploy --project-name "$TPG_PROJECT" --branch "$TPG_BRANCH" --commit-dirty=true
